[project]
name = "job-search-swarm"
version = "0.1.0"
description = "Human-in-the-loop job-search engine: deterministic multi-board crawler, funding-news ATS arbitrage swarm, evidence-graded fit scoring"
requires-python = ">=3.11"
dependencies = ["pyyaml"]
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
pracuj-ai = "pracuj_ai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pracuj_ai"]
